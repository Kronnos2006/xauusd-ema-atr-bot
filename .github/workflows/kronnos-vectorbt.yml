name: KRONNOS - vectorbt offline backtest
on:
  pull_request:
    paths:
      - 'tools/kronnos_vectorbt.py'
      - 'tests/test_kronnos_vectorbt.py'
      - '.github/workflows/kronnos-vectorbt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vectorbt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'vectorbt==0.28.1' 'plotly==5.24.1'
      - run: python -m unittest discover -s tests -p 'test_kronnos_vectorbt.py' -v
