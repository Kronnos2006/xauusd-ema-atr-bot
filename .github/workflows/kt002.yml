name: KT-002 acierto prospectivo BTC

# Registro previo: docs/KT-002_registro_prospectivo.md
# Descriptivo: sin ordenes, sin MT5, sin capital. Para detener: desactivar este workflow.

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, minuto 7 UTC (la vela 1h ya cerro)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - tools/kt002_prospectivo.py
      - .github/workflows/kt002.yml
      - data/kt002/despertar.txt   # lo toca el despertador (guardia.yml) cada ~4 h

permissions:
  contents: write

concurrency:
  group: kt002
  cancel-in-progress: false

jobs:
  pronosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      KRONOS_SRC: ${{ github.workspace }}/tools/kronos-upstream
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/evidencia/KT-001/requirements-resolved.txt

      - name: Codigo Kronos fijado
        run: |
          mkdir -p "$KRONOS_SRC" && cd "$KRONOS_SRC"
          git init -q
          git remote add origin https://github.com/shiyu-coder/Kronos
          git fetch -q --depth 1 origin 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          git checkout -q FETCH_HEAD

      - name: Dependencias (versiones de KT-001)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r docs/evidencia/KT-001/requirements-resolved.txt

      - name: Cache de pesos
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-kt002-901c26c1-0e011738-1d952420

      - name: Pronosticar cada hora durante ~4 h 45 min
        run: |
          # El cron horario de GitHub no se ejecuta en este repo: el job se queda vivo y corre
          # el mismo script en cada hora (minuto 7 UTC). La guardia (guardia.yml) lo relanza cada ~4 h:
          # como el job dura ~4 h 45 min, el relanzamiento queda en cola (grupo kt002) y arranca
          # apenas termina el anterior. Nunca corren dos a la vez.
          git config user.name "kt002-bot"
          git config user.email "kt002-bot@users.noreply.github.com"
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/kt002-logs"
          fallas=0
          fin=$(( $(date +%s) + 285*60 ))
          while :; do
            log="$RUNNER_TEMP/kt002-logs/vuelta-$(date -u +%Y%m%dT%H%MZ).log"
            # Traer lo que dejo el job anterior (el checkout es del commit que disparo este job)
            # para que el script vea los pronosticos ya hechos y no repita la misma base.
            if git pull -q --rebase origin "${GITHUB_REF_NAME}" >>"$log" 2>&1; then
              if ! python tools/kt002_prospectivo.py 2>&1 | tee -a "$log"; then
                echo "::error::Fallo la vuelta $(date -u +%H:%MZ); se cuenta como hora omitida (log: $(basename "$log"))"
                fallas=$((fallas + 1))
              fi
            else
              git rebase --abort 2>/dev/null || true
              echo "::error::No se pudo actualizar desde origin; vuelta omitida para no duplicar filas"
              fallas=$((fallas + 1))
            fi
            git add data/kt002
            if ! git diff --cached --quiet; then
              git commit -q -m "KT-002: registro $(date -u +%Y-%m-%dT%H:%MZ)"
              subido=0
              for i in 1 2 3; do
                if git pull -q --rebase origin "${GITHUB_REF_NAME}" >>"$log" 2>&1 \
                   && git push -q origin HEAD:"${GITHUB_REF_NAME}" >>"$log" 2>&1; then
                  subido=1; break
                fi
                git rebase --abort 2>/dev/null || true
                sleep 10
              done
              if [ "$subido" -ne 1 ]; then
                echo "::error::No se pudo subir el registro de esta vuelta (log: $(basename "$log"))"
                fallas=$((fallas + 1))
              fi
            fi
            prox=$(( ( $(date +%s) / 3600 + 1 ) * 3600 + 7*60 ))
            [ "$prox" -gt "$fin" ] && break
            sleep $(( prox - $(date +%s) ))
          done
          if [ "$fallas" -gt 0 ]; then
            echo "::error::$fallas vuelta(s) con falla en esta corrida"
            exit 1
          fi

      - name: Guardar logs de cada vuelta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kt002-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kt002-logs/
          retention-days: 30
          if-no-files-found: warn
