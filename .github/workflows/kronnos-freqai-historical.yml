name: Kronnos - FreqAI historical Binance verified
on:
  pull_request:
    paths:
      - tools/kronnos_binance_vision_archive.py
      - tools/kronnos_freqai_native_fit.py
      - .github/workflows/kronnos-freqai-historical.yml
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'  # cada lunes, evaluación histórica aislada
permissions:
  contents: read
jobs:
  historical-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Descargar archivo mensual disponible con CHECKSUM
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Binance puede publicar los ZIP mensuales con retraso; no asumir que el último mes ya existe.
          for offset in 1 2 3 4 5 6; do
            first=$(date -u +%Y-%m-01)
            month=$(date -u -d "$first -$offset month" +%Y-%m)
            echo "Probando disponibilidad de $month"
            if python3 tools/kronnos_binance_vision_archive.py --month "$month" --output artifacts/binance-historical.csv; then
              echo "Archivo verificado: $month" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::No se halló un archivo mensual completo y verificable en los últimos 6 meses"
          exit 1
      - name: Execute native FreqAI LightGBM fit/predict with real historical bars
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" --entrypoint python freqtradeorg/freqtrade:stable_freqai /work/tools/kronnos_freqai_native_fit.py --historical-csv /work/artifacts/binance-historical.csv | tee artifacts/freqai-historical-report.json
          python3 -c 'import json; r=json.load(open("artifacts/freqai-historical-report.json")); assert r["freqai_model_fit_executed"] and r["freqai_model_predict_executed"] and r["dataset"]=="BINANCE_SPOT_HISTORICAL" and not r["promotion_permitted"]'
      - name: Verificar recuento de FreqAI con datos sintéticos
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network none -v "$PWD:/work:ro" --entrypoint python freqtradeorg/freqtrade:stable_freqai /work/tools/kronnos_freqai_native_fit.py | tee artifacts/freqai-synthetic-report.json
          python3 -c 'import json; r=json.load(open("artifacts/freqai-synthetic-report.json")); assert r["dataset"]=="SYNTHETIC" and r["freqai_model_fit_executed"] and r["freqai_model_predict_executed"]; assert r["n_purged"]==1 and r["n_train"]+r["n_purged"]+r["n_test"]==180'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kronnos-freqai-historical
          path: |
            artifacts/binance-historical.manifest.json
            artifacts/freqai-historical-report.json
            artifacts/freqai-synthetic-report.json
          retention-days: 14
