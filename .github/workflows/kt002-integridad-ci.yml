name: KT-002 integridad (solo lectura, sin Claude)

on:
  pull_request:
    paths:
      - tools/audit_kt002_integridad.py
      - tests/test_audit_kt002_integridad.py
      - .github/workflows/kt002-integridad-ci.yml
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'  # una verificación diaria a las 13:15 UTC, solo tras fusionar a master

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas sintéticas (sin modelos ni red)
        run: python -m unittest discover -s tests -p 'test_audit_kt002_integridad.py' -v
      - name: Leer CSV publicado (sin modificarlo)
        run: |
          python tools/audit_kt002_integridad.py --csv data/kt002/predicciones.csv > "$RUNNER_TEMP/kt002-integridad.json"
          cat "$RUNNER_TEMP/kt002-integridad.json"
          echo '## Control estático KT-002' >> "$GITHUB_STEP_SUMMARY"
          echo 'Este análisis es solo lectura. No certifica ejecuciones de los modelos ni ventaja económica.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/kt002-integridad.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fallar si se detectan anomalías estructurales
        run: |
          python -c 'import json,os,sys; p=os.path.join(os.environ["RUNNER_TEMP"],"kt002-integridad.json"); d=json.load(open(p)); print("Estado:",d["veredicto_integridad_basica"]); sys.exit(1 if d["veredicto_integridad_basica"] != "SIN_ANOMALIAS_ESTRUCTURALES" else 0)'

      - name: Detectar corridas estancadas (solo programación diaria)
        if: github.event_name == 'schedule'
        run: python tools/audit_kt002_integridad.py --csv data/kt002/predicciones.csv --max-age-hours 3
