name: Kronnos - entrenamiento piloto Ridge (datos sinteticos)
on:
  pull_request:
    paths:
      - tools/kronnos_entrenamiento_piloto.py
      - tests/generate_synthetic_bars_kronnos.py
      - .github/workflows/kronnos-entrenamiento-piloto.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fixture sintético explícitamente marcado
        run: python3 tests/generate_synthetic_bars_kronnos.py artifacts/synthetic-bars.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar scikit-learn aislado
        run: python -m pip install scikit-learn==1.7.2
      - name: Fit real de Ridge, sin broker ni trading
        run: python tools/kronnos_entrenamiento_piloto.py --input artifacts/synthetic-bars.csv --out artifacts/model-fit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kronnos-fit-synthetic
          path: artifacts/model-fit-report.json
          if-no-files-found: warn
          retention-days: 14
