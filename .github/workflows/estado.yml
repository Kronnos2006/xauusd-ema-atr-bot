name: Estado - actualizar ESTADO.md (sin IA)
on:
  schedule:
    - cron: '17 12 * * *'   # 06:17 Costa Rica, antes del informe gerencial
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/generar_estado.py'
      - '.github/workflows/estado.yml'
permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: estado-md
  cancel-in-progress: false
jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: Generar ESTADO.md (0 llamadas a IA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/generar_estado.py
      - name: Commit si cambió (solo ESTADO.md)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "estado-bot"
          git config user.email "estado-bot@users.noreply.github.com"
          git add ESTADO.md
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "Estado: ESTADO.md automático $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q && exit 0; sleep 10; done
          exit 1
