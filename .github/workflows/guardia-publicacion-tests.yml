name: Guardia - pruebas de publicacion segura
on:
  pull_request:
    paths:
      - 'tools/publicar_mercado_seguro.py'
      - 'tools/guardia_salud.py'
      - 'tests/test_guardia_salud.py'
      - 'tests/test_guardia_entradas_invalidas.py'
      - 'tests/test_publicar_mercado_seguro.py'
      - '.github/workflows/guardia.yml'
      - '.github/workflows/guardia-publicacion-tests.yml'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis
        run: python3 -m py_compile tools/publicar_mercado_seguro.py tests/test_publicar_mercado_seguro.py
      - name: Pruebas adversariales de publicación
        run: python3 -m unittest discover -s tests -p 'test_publicar_mercado_seguro.py' -v
      - name: Salud y entradas adversariales (sin red ni mutaciones)
        run: |
          python3 -m unittest discover -s tests -p 'test_guardia_salud.py' -v
          python3 -m unittest discover -s tests -p 'test_guardia_entradas_invalidas.py' -v
