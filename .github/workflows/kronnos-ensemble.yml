name: Kronnos - ensemble exploratorio CI
on:
  pull_request:
    paths:
      - tools/kronnos_ensemble.py
      - tests/test_kronnos_ensemble.py
      - .github/workflows/kronnos-ensemble.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_kronnos_ensemble.py -v
      - run: python3 -m py_compile tools/kronnos_ensemble.py
