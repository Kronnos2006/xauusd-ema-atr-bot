name: Kronnos - preflight de evidencia motores
on:
  pull_request:
    paths:
      - 'tools/preflight_motores.py'
      - 'tests/test_preflight_motores.py'
      - '.github/workflows/motores-preflight-kronnos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar esquema y rechazo de evidencia falsa
        run: python3 -m unittest discover -s tests -p 'test_preflight_motores.py' -v
      - name: Compilar y auditar scripts
        run: |
          python3 -m compileall -q tools/preflight_motores.py
          python3 tools/auditoria_scripts.py
