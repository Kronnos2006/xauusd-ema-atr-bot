name: Kronnos - contrato Qlib sin IA
on:
  pull_request:
    paths:
      - tools/adapter_qlib_kronnos.py
      - tests/test_adapter_qlib_kronnos.py
      - .github/workflows/kronnos-qlib-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_adapter_qlib_kronnos.py -v
      - run: python3 -m py_compile tools/adapter_qlib_kronnos.py
