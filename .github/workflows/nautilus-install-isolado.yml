name: Kronnos - NautilusTrader instalacion aislada
on:
  pull_request:
    paths:
      - '.github/workflows/nautilus-install-isolado.yml'
      - 'tools/inspeccion_nautilus.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kronnos-nautilus-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nautilus:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/nautilus-install-isolado.yml'
      - name: Instalar NautilusTrader estable 1.x sin credenciales
        run: |
          python -m pip install --disable-pip-version-check 'nautilus_trader<2'
          python -m pip freeze > nautilus-dependencies.txt
      - name: Verificar libreria real y version
        run: python tools/inspeccion_nautilus.py
      - name: Resumen
        if: always()
        run: |
          echo '### Kronnos - NautilusTrader smoke test' >> "$GITHUB_STEP_SUMMARY"
          if test -f artifacts/nautilus-inspeccion.json; then cat artifacts/nautilus-inspeccion.json >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'NO BACKTEST - NO LIVE ORDERS' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-smoke-${{ github.run_id }}
          path: |
            artifacts/nautilus-inspeccion.json
            nautilus-dependencies.txt
          if-no-files-found: warn
          retention-days: 14
