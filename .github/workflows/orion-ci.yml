name: ORION Centro de Control - pruebas (sin Claude)

on:
  pull_request:
    paths:
      - dashboard/**
      - tools/centro_control.py
      - tools/orion_release_check.py
      - tests/test_orion_release.py
      - tests/test_centro_control.py
      - tools/orion_comandos.py
      - tools/orion_arbitro.py
      - tests/test_orion_arbitro.py
      - .github/workflows/orion-arbitro.yml
      - tests/test_orion_comandos.py
      - .github/workflows/orion-comandos.yml
      - .github/workflows/orion-ci.yml
      - docs/gerencia/ORION_CENTRO_CONTROL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas sintéticas
        run: python -m unittest discover -s tests -p 'test_centro_control.py' -v
      - name: Pruebas de comandos operativos seguros
        run: python -m unittest discover -s tests -p 'test_orion_comandos.py' -v
      - name: Comprobar árbitro de coordinación
        run: python -m unittest discover -s tests -p 'test_orion_arbitro.py' -v
      - name: Control de entrega estable ORION
        run: |
          python -m unittest discover -s tests -p 'test_orion_release.py' -v
          python tools/orion_release_check.py --json
      - name: Validar JavaScript incrustado en HTML
        run: |
          python -c 'from pathlib import Path; import re; s=Path("dashboard/index.html").read_text(); js=re.search(r"<script>(.*?)</script>",s,re.S); assert js; Path("/tmp/orion-ui.js").write_text(js.group(1))'
          node --check /tmp/orion-ui.js
      - name: Ensamblar panel con snapshot publicado
        run: |
          python tools/centro_control.py status
          python tools/centro_control.py build
          python -c 'import json; d=json.load(open(".local/centro-control/data.json")); assert d["meta"]["readonly"]; assert d["kt002"]["rentabilidad_evaluada"] is False; print("ORION datos válidos:", len(d["agents"]["nodes"]), "agentes")'
