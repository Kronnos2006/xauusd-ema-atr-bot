name: Kronnos - fase 2 Qlib Binance sandbox
on:
  pull_request:
    paths:
      - tools/kronnos_binance_bars.py
      - tests/test_kronnos_binance_bars.py
      - .github/workflows/kronnos-qlib-binance-phase2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binance-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_kronnos_binance_bars.py -v
      - name: Descargar barras publicas de Binance y guardar linaje
        run: python3 tools/kronnos_binance_bars.py --symbol BTCUSDT --interval 1h --limit 24
      - uses: actions/upload-artifact@v4
        with:
          name: kronnos-btc-spot-research
          path: |
            artifacts/binance-btcusdt-1h.csv
            artifacts/binance-btcusdt-1h.manifest.json
          retention-days: 14
  qlib-instalacion-real:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Qlib real desde PyPI en entorno aislado
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyqlib
      - name: Importar framework y documentar version real
        run: |
          python - <<'PY'
          import importlib.metadata as m
          import qlib
          print("KRONNOS_QLIB_INSTALADO",m.version("pyqlib"))
          print("QLIB_BACKTEST_EJECUTADO=false")
          print("TRADING_REAL=false")
          PY
